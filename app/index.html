<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Palms Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Sunset Palms <span>Cover Studio</span></h1>
    <p class="tag">A gallery-grade, offline multi-panel GTA-style cover art studio.</p>

    <div class="row">
      <label>Layout
        <select id="layout"></select>
      </label>
      <label>Canvas size
        <select id="size"></select>
      </label>
    </div>

    <p id="selectedLabel" class="selected-label">Editing panel 1</p>

    <div class="row">
      <label class="grow">Photo upload (multi-file ok) <input id="photo" type="file" accept="image/*" multiple></label>
    </div>
    <div class="row samples">
      <span>Drop onto canvas, or pick a sample:</span>
    </div>
    <div id="sampleThumbs" class="thumbs"></div>

    <div class="row">
      <button id="autoFill" type="button" class="ghost">Auto-Fill All Panels</button>
      <button id="recenter" type="button" class="ghost">Face-Aware Recenter</button>
    </div>
    <div class="row">
      <button id="swap" type="button" class="ghost">Swap w/ Next</button>
      <button id="shuffle" type="button" class="ghost">Shuffle Panels</button>
      <button id="flip" type="button" class="ghost">Flip Panel</button>
    </div>

    <label>Zoom <input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></label>
    <div class="row">
      <label>Pan X <input id="panX" type="range" min="-1" max="1" step="0.01" value="0"></label>
      <label>Pan Y <input id="panY" type="range" min="-1" max="1" step="0.01" value="0"></label>
    </div>

    <div class="row">
      <label>Color grade
        <select id="grade"></select>
      </label>
      <button id="applyAllGrade" type="button" class="ghost">Apply to all</button>
    </div>

    <div class="row">
      <label>Ink strength <input id="ink" type="range" min="0" max="1" step="0.01" value="0.6"></label>
      <label>Posterize <input id="posterize" type="range" min="2" max="8" step="1" value="5"></label>
    </div>
    <label>Grain <input id="grain" type="range" min="0" max="1" step="0.01" value="0.25"></label>

    <label>Title <input id="title" type="text" maxlength="40" value="SUNSET PALMS"></label>
    <label>Subtitle <input id="subtitle" type="text" maxlength="60" value="Leonida Nights"></label>

    <div class="row">
      <label>5-Star Heat <input id="heat" type="range" min="0" max="5" step="1" value="5"></label>
      <label>Style recipe
        <select id="recipe"></select>
      </label>
    </div>

    <details class="overlays">
      <summary>Overlays &amp; billing text</summary>
      <label>Edition seal <input id="seal" type="text" maxlength="40" value="SUNSET PALMS EDITION"></label>
      <label>Review strip <input id="review" type="text" maxlength="80" value=""></label>
      <label>Billing block <input id="billing" type="text" maxlength="120" value=""></label>
      <div class="row toggles">
        <label class="check"><input id="toggleCallouts" type="checkbox" checked> Callout tags</label>
        <label class="check"><input id="toggleHeat" type="checkbox" checked> Heat bar</label>
        <label class="check"><input id="toggleSeal" type="checkbox" checked> Edition seal</label>
      </div>
      <div class="row toggles">
        <label class="check"><input id="toggleReview" type="checkbox" checked> Review strip</label>
        <label class="check"><input id="toggleBilling" type="checkbox" checked> Billing block</label>
        <label class="check"><input id="toggleInk" type="checkbox" checked> Poster Ink filter</label>
      </div>
    </details>

    <div class="row">
      <button id="undo" type="button" class="ghost" disabled>Undo</button>
      <button id="redo" type="button" class="ghost" disabled>Redo</button>
    </div>
    <div class="row">
      <button id="export" type="button" class="primary">Export PNG</button>
      <button id="exportAll" type="button" class="primary">Download All Sizes</button>
    </div>
    <p id="status" role="status"></p>
  </section>

  <section class="stage">
    <canvas id="cover" width="1920" height="1080" aria-label="The cover art"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
